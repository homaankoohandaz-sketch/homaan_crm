<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بانک فایل هومان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{--bg:#F7F5F1;--surface:#FFFFFF;--ink:#1B2430;--ink-soft:#5B6472;--border:#E2DFD6;--navy:#1F3A4D;--navy-dark:#132531;--teal:#0F5C4F;--teal-soft:#E3F0EC;--amber:#B9752B;--amber-soft:#FBF0E1;--red:#A23B2E;--red-soft:#FBEAE6;--radius:10px}
  *{box-sizing:border-box}body{margin:0;font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--ink)}input,select,textarea,button{font-family:inherit;font-size:14px}h1,h2,h3{font-weight:600;margin:0}
  #authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.authCard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px 28px;width:100%;max-width:380px}.authTitle{font-size:20px;color:var(--navy-dark);margin-bottom:4px}.authSub{color:var(--ink-soft);font-size:13px;margin-bottom:24px}.tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--border)}.tab{flex:1;text-align:center;padding:10px 0;cursor:pointer;color:var(--ink-soft);border-bottom:2px solid transparent;font-size:14px}.tab.active{color:var(--navy-dark);border-color:var(--teal);font-weight:600}.field{margin-bottom:14px}.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px}.field input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg)}.btnPrimary{width:100%;padding:11px;border:none;border-radius:8px;background:var(--navy);color:#fff;font-weight:600;cursor:pointer}.authMsg{margin-top:12px;font-size:13px;text-align:center}.authMsg.err{color:var(--red)}.authMsg.ok{color:var(--teal)}
  #appScreen{display:none;min-height:100vh}header.topbar{background:var(--navy);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}header.topbar .brand{font-size:16px;font-weight:600}header.topbar .userbox{display:flex;align-items:center;gap:10px;font-size:13px}.roleBadge{background:rgba(255,255,255,.15);padding:3px 10px;border-radius:20px;font-size:11px}.signout{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px}nav.tabbar{display:flex;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--border)}nav.tabbar button{flex-shrink:0;padding:13px 16px;background:none;border:none;cursor:pointer;font-size:13px;color:var(--ink-soft);border-bottom:2px solid transparent;white-space:nowrap}nav.tabbar button.active{color:var(--navy-dark);border-color:var(--teal);font-weight:600}main{padding:16px;max-width:960px;margin:0 auto}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sectionHead h2{font-size:17px;color:var(--navy-dark)}.btnAdd{background:var(--teal);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}.card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.card .title{font-size:14px;font-weight:600;color:var(--ink)}.card .meta{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.8}.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}.badge.active{background:var(--teal-soft);color:var(--teal)}.badge.pending{background:var(--amber-soft);color:var(--amber)}.badge.inactive{background:var(--red-soft);color:var(--red)}.cardActions{display:flex;gap:8px;margin-top:10px}.iconBtn{border:1px solid var(--border);background:var(--bg);padding:5px 11px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--ink-soft)}.empty{text-align:center;color:var(--ink-soft);padding:40px 10px;font-size:13px}.overlay{display:none;position:fixed;inset:0;background:rgba(20,25,32,.45);align-items:center;justify-content:center;padding:16px;z-index:50}.overlay.show{display:flex}.modal{background:var(--surface);border-radius:14px;padding:22px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto}.modal h3{font-size:16px;margin-bottom:16px;color:var(--navy-dark)}.modal .field input,.modal .field select,.modal .field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;background:var(--bg)}.modal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modalActions{display:flex;gap:8px;margin-top:16px}.btnGhost{flex:1;padding:10px;border:1px solid var(--border);background:none;border-radius:8px;cursor:pointer;color:var(--ink-soft)}.btnSave{flex:1;padding:10px;border:none;background:var(--teal);color:#fff;border-radius:8px;cursor:pointer;font-weight:600}.loading{text-align:center;padding:30px;color:var(--ink-soft);font-size:13px}
  .aiShell{background:linear-gradient(180deg,#fff 0,#f8fbfa 100%);border:1px solid var(--border);border-radius:18px;overflow:hidden}.aiHead{padding:20px;background:var(--navy);color:#fff}.aiHead h2{font-size:20px}.aiHead p{margin:6px 0 0;color:#dce6eb;font-size:12px}.aiBody{padding:18px}.aiMessages{min-height:90px;max-height:380px;overflow:auto}.aiMsg{padding:11px 14px;border-radius:14px;margin:8px 0;line-height:1.9;font-size:13px;white-space:pre-wrap}.aiMsg.user{background:#e9eef2;margin-right:20%}.aiMsg.assistant{background:var(--teal-soft);margin-left:12%}.aiComposer{display:flex;gap:8px;margin-top:14px}.aiComposer textarea{flex:1;resize:none;min-height:54px;padding:12px;border:1px solid var(--border);border-radius:12px;background:#fff}.aiSend{border:0;background:var(--teal);color:#fff;border-radius:12px;padding:0 18px;font-weight:600;cursor:pointer}.aiActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.aiAction{border:1px solid var(--border);background:#fff;border-radius:10px;padding:7px 12px;cursor:pointer;font-size:12px}.propertyGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.propertyMini{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px}.propertyMini b{display:block;margin-bottom:5px}.proSearch{display:none;margin-top:14px;padding:14px;background:#fff;border:1px solid var(--border);border-radius:12px}.proSearch.show{display:block}.proSearch textarea{width:100%;min-height:70px;padding:10px;border:1px solid var(--border);border-radius:9px}.roomPreview{display:none;margin-top:14px;padding:16px;border:1px dashed var(--border);border-radius:12px;background:#fff}.roomPreview.show{display:block}
</style></head><body>
<div id="authScreen"><div class="authCard"><div class="authTitle">بانک فایل هومان</div><div class="authSub">ورود یا ثبت‌نام برای دسترسی به سامانه</div><div class="tabs"><div class="tab active" data-mode="signin">ورود</div><div class="tab" data-mode="signup">ثبت‌نام</div></div><div class="field"><label>ایمیل</label><input id="authEmail" type="email"></div><div class="field"><label>رمز عبور</label><input id="authPass" type="password"></div><div class="field" id="fullNameField" style="display:none"><label>نام و نام خانوادگی</label><input id="authName" type="text"></div><button class="btnPrimary" id="authSubmit">ورود</button><div class="authMsg" id="authMsg"></div></div></div>
<div id="appScreen"><header class="topbar"><div class="brand">بانک فایل هومان — AI CRM</div><div class="userbox"><span id="userName"></span><span class="roleBadge" id="userRole"></span><button class="signout" id="signOutBtn">خروج</button></div></header><nav class="tabbar" id="tabbar"></nav><main id="mainContent"><div class="loading">در حال بارگذاری...</div></main></div><div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div><input type="file" id="excelFileInput" accept=".xlsx,.xls" style="display:none">
<script>
const SUPABASE_URL='https://beuestoewletjsgmigmf.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJldWVzdG9ld2xldGpzZ21pZ21mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5ODE0MDAsImV4cCI6MjEwMzU1NzQwMH0.oYeA3TvkHiNW10ogKMzhT91PIT1gtjN99lobpj-tOPw';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let currentUser=null,currentProfile=null,currentTab='dashboard',authMode='signin';
const TABS=[{id:'dashboard',label:'AI مرکز'},{id:'properties',label:'املاک'},{id:'leads',label:'خواهان‌ها'},{id:'calendar',label:'تقویم'},{id:'tasks',label:'وظایف'},{id:'deals',label:'معاملات'},{id:'owners',label:'مالکین'},{id:'users',label:'کاربران',ownerOnly:true},{id:'logs',label:'لاگ',ownerOnly:true}];
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function roleLabel(r){return r==='owner'?'مالک':r==='staff'?'مشاور':'مشاهده‌گر'}function canWrite(){return currentProfile&&(currentProfile.role==='owner'||currentProfile.role==='staff')}function isOwner(){return currentProfile?.role==='owner'}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');authMode=t.dataset.mode;document.getElementById('fullNameField').style.display=authMode==='signup'?'block':'none';document.getElementById('authSubmit').textContent=authMode==='signup'?'ثبت‌نام':'ورود'});
document.getElementById('authSubmit').onclick=async()=>{const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPass').value,msg=document.getElementById('authMsg');if(!email||!password){msg.textContent='ایمیل و رمز عبور را وارد کنید';msg.className='authMsg err';return}if(authMode==='signup'){const full_name=document.getElementById('authName').value.trim();const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name}}});if(error){msg.textContent=error.message;msg.className='authMsg err';return}if(data.session)afterLogin();else{msg.textContent='ثبت‌نام انجام شد؛ ایمیل را بررسی کنید.';msg.className='authMsg ok'}}else{const {error}=await sb.auth.signInWithPassword({email,password});if(error){msg.textContent='ورود ناموفق: '+error.message;msg.className='authMsg err';return}afterLogin()}};
document.getElementById('signOutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function afterLogin(){const {data:{user}}=await sb.auth.getUser();if(!user)return;currentUser=user;const {data:profile,error}=await sb.from('app_roles').select('*').eq('user_id',user.id).single();if(error||!profile){document.getElementById('authMsg').textContent='پروفایل کاربری پیدا نشد.';document.getElementById('authMsg').className='authMsg err';return}currentProfile=profile;document.getElementById('authScreen').style.display='none';document.getElementById('appScreen').style.display='block';document.getElementById('userName').textContent=profile.full_name||user.email;document.getElementById('userRole').textContent=roleLabel(profile.role);buildTabs();renderTab('dashboard')}
function buildTabs(){const bar=document.getElementById('tabbar');bar.innerHTML='';TABS.filter(t=>!t.ownerOnly||isOwner()).forEach(t=>{const b=document.createElement('button');b.textContent=t.label;b.className=t.id===currentTab?'active':'';b.onclick=()=>renderTab(t.id);bar.appendChild(b)})}
async function renderTab(id){currentTab=id;buildTabs();const m=document.getElementById('mainContent');if(id==='dashboard')return renderAIHome(m);m.innerHTML='<div class="loading">در حال بارگذاری...</div>';if(id==='properties')return renderProperties(m);if(id==='leads')return renderLeads(m);if(id==='owners')return renderOwners(m);if(id==='calendar')return renderCalendar(m);if(id==='tasks')return renderTasks(m);if(id==='deals')return renderDeals(m);if(id==='users')return renderUsers(m);if(id==='logs')return renderLogs(m)}
function renderAIHome(m){m.innerHTML=`<section class="aiShell"><div class="aiHead"><h2>مرکز هوش مصنوعی هومان</h2><p>درخواست ملک را طبیعی بنویسید؛ AI بانک فایل و سابقه CRM را بررسی می‌کند و ابتدا ۳ نتیجه می‌دهد.</p></div><div class="aiBody"><div id="aiMessages" class="aiMessages"><div class="aiMsg assistant">برای شروع، درخواست مشتری یا جستجوی خودتان را بنویسید. مثال: «آپارتمان ۳ خواب قصرالدشت تا ۱۵ میلیارد»</div></div><div id="aiCards" class="propertyGrid"></div><div class="aiActions"><button class="aiAction" onclick="moreAI()">بیشتر</button><button class="aiAction" onclick="togglePro()">جستجوی حرفه‌ای مشاور</button><button class="aiAction" onclick="showRoomPreview()">Customer Room</button></div><div id="proSearch" class="proSearch"><textarea id="proQuery" placeholder="جستجوی حرفه‌ای را طبیعی بنویسید..."></textarea><button class="btnAdd" onclick="runProSearch()">اجرای جستجوی حرفه‌ای</button></div><div id="roomPreview" class="roomPreview"><b>پیش‌نمایش Room مشتری</b><p class="muted">لینک اختصاصی، سه فایل منتخب، مقایسه، علاقه‌مندی و چت AI در فاز Room فعال می‌شود.</p></div><div class="aiComposer"><textarea id="aiInput" placeholder="درخواست را بنویسید..."></textarea><button class="aiSend" onclick="sendAI()">ارسال</button></div></div></section>`;window.__aiOffset=0}
async function callAI(payload){const {data:{session}}=await sb.auth.getSession();const r=await fetch(SUPABASE_URL+'/functions/v1/ai-orchestrator',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(session?.access_token||SUPABASE_ANON_KEY)},body:JSON.stringify(payload)});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||'AI request failed');return d}
async function sendAI(){const input=document.getElementById('aiInput'),q=input.value.trim();if(!q)return;addAI('user',q);input.value='';try{const d=await callAI({action:'search_properties',query:q,limit:3,offset:0});window.__aiLastQuery=q;window.__aiOffset=3;renderAIResult(d)}catch(e){addAI('assistant','اتصال به موتور AI برقرار نشد: '+e.message)}}
async function moreAI(){if(!window.__aiLastQuery){addAI('assistant','ابتدا یک جستجو انجام دهید.');return}try{const d=await callAI({action:'search_properties',query:window.__aiLastQuery,limit:3,offset:window.__aiOffset||3});window.__aiOffset=(window.__aiOffset||3)+3;renderAIResult(d)}catch(e){addAI('assistant','دریافت نتایج بیشتر انجام نشد.')}}
function addAI(role,text){const el=document.getElementById('aiMessages');if(!el)return;el.insertAdjacentHTML('beforeend',`<div class="aiMsg ${role}">${esc(text)}</div>`);el.scrollTop=el.scrollHeight}
function renderAIResult(d){const msg=d.message||'نتایج آماده شد.';addAI('assistant',msg);const arr=d.properties||d.results||[];document.getElementById('aiCards').innerHTML=arr.slice(0,3).map((p,i)=>`<article class="propertyMini"><b>فایل ${i+1}</b><div>${esc(p.title||p.property_type||'ملک')}</div><div class="muted">${esc(p.neighborhood||'')} ${p.bedrooms?`• ${esc(p.bedrooms)} خواب`:''}</div><div class="muted">${p.total_price?Number(p.total_price).toLocaleString('fa-IR')+' تومان':''}</div></article>`).join('')}
function togglePro(){document.getElementById('proSearch').classList.toggle('show')}function showRoomPreview(){document.getElementById('roomPreview').classList.toggle('show')}async function runProSearch(){const q=document.getElementById('proQuery').value.trim();if(!q)return;addAI('user','جستجوی حرفه‌ای: '+q);try{const d=await callAI({action:'search_properties',query:q,limit:3,professional:true});renderAIResult(d)}catch(e){addAI('assistant','جستجوی حرفه‌ای در دسترس نیست: '+e.message)}}
async function renderProperties(m){const {data,error}=await sb.from('crm_property_safe').select('*').limit(100).order('created_at',{ascending:false});m.innerHTML=`<div class="sectionHead"><h2>املاک</h2>${canWrite()?'<button class="btnAdd" onclick="openPropertyForm()">+ ثبت ملک</button>':''}</div>`;if(error){m.innerHTML+='<div class="empty">خطا در دریافت فایل‌ها</div>';return}if(!data?.length){m.innerHTML+='<div class="empty">هنوز فایلی ثبت نشده است.</div>';return}data.forEach(p=>{m.innerHTML+=`<div class="card"><div class="row1"><div><div class="title">${esc(p.title||p.property_type||'ملک')}</div><div class="meta">${esc(p.neighborhood||'')} ${p.built_area?'• '+esc(p.built_area)+' متر':''} ${p.bedrooms?'• '+esc(p.bedrooms)+' خواب':''}</div></div><span class="badge active">${esc(p.status||'فعال')}</span></div></div>`})}
async function renderLeads(m){const {data,error}=await sb.from('leads').select('id,full_name,property_type,region,budget_min,budget_max,status,created_at').limit(100).order('created_at',{ascending:false});m.innerHTML='<div class="sectionHead"><h2>خواهان‌ها</h2></div>';if(error){m.innerHTML+='<div class="empty">خطا در دریافت خواهان‌ها</div>';return}if(!data?.length){m.innerHTML+='<div class="empty">خواهان ثبت نشده است.</div>';return}data.forEach(x=>m.innerHTML+=`<div class="card"><div class="title">${esc(x.full_name||'بدون نام')}</div><div class="meta">${esc(x.property_type||'')} • منطقه ${esc(x.region||'')} • بودجه ${esc(x.budget_min||'')} تا ${esc(x.budget_max||'')}</div></div>`)}
async function renderOwners(m){const {data,error}=await sb.from('owners').select('id,full_name,created_at').limit(100);m.innerHTML='<div class="sectionHead"><h2>مالکین</h2></div>';if(error){m.innerHTML+='<div class="empty">خطا در دریافت مالکین</div>';return}if(!data?.length){m.innerHTML+='<div class="empty">مالک ثبت نشده است.</div>';return}data.forEach(x=>m.innerHTML+=`<div class="card"><div class="title">${esc(x.full_name||'بدون نام')}</div></div>`)}
function simpleTab(m,title,text){m.innerHTML=`<div class="sectionHead"><h2>${title}</h2></div><div class="empty">${text}</div>`}function renderCalendar(m){simpleTab(m,'تقویم','تقویم و تشخیص تداخل در فاز Agent Appointment تکمیل می‌شود.')}function renderTasks(m){simpleTab(m,'وظایف','وظایف و Follow-up در فاز Agent Automation تکمیل می‌شود.')}function renderDeals(m){simpleTab(m,'معاملات','هسته Deal Agent در فاز معاملات تکمیل می‌شود.')}function renderUsers(m){simpleTab(m,'کاربران','مدیریت کاربران فقط برای مالک نمایش داده می‌شود.')}function renderLogs(m){simpleTab(m,'لاگ فعالیت','Audit Trail اقدامات AI در backend ثبت می‌شود.')}function openPropertyForm(){document.getElementById('modalBody').innerHTML='<h3>ثبت ملک</h3><div class="field"><label>عنوان</label><input id="pTitle"></div><div class="modalActions"><button class="btnGhost" onclick="closeModal()">لغو</button><button class="btnSave" onclick="saveProperty()">ثبت</button></div>';document.getElementById('overlay').classList.add('show')}function closeModal(){document.getElementById('overlay').classList.remove('show')}async function saveProperty(){const title=document.getElementById('pTitle').value.trim();if(!title)return;const {error}=await sb.from('properties').insert({title});if(error)alert(error.message);else{closeModal();renderTab('properties')}}
async function importExcelFile(file){if(!file)return;const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{defval:''});return {sheet:wb.SheetNames[0],rows}}
async function startExcelImport(){const input=document.getElementById('excelFileInput');input.value='';input.onchange=async()=>{try{const result=await importExcelFile(input.files[0]);alert(`Sheet: ${result.sheet}\nتعداد ردیف: ${result.rows.length}`)}catch(e){alert('خطا در خواندن Excel: '+e.message)}};input.click()}
</script></body></html>
