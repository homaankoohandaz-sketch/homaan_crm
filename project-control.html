<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BuildWise AI+H — کنترل پروژه</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f2;margin:0;color:#222}.wrap{max-width:1200px;margin:auto;padding:18px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff;padding:14px 16px;border-radius:14px;box-shadow:0 4px 20px #0000000d}.brand{font-weight:900;font-size:19px}.brand small{display:block;font-size:11px;color:#777;font-weight:500;margin-top:3px}.tools{display:flex;gap:8px;flex-wrap:wrap}select,button,input{font:inherit;border:1px solid #ddd;border-radius:9px;padding:9px 11px;background:#fff}button{cursor:pointer}.primary{background:#222;color:#fff;border-color:#222}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.card{background:#fff;border:1px solid #e8e8e4;border-radius:13px;padding:14px}.metric{font-size:24px;font-weight:900;margin-top:5px}.muted{color:#777;font-size:12px}.danger{color:#a33}.ok{color:#277044}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tab{white-space:nowrap}.tab.active{background:#222;color:#fff}.panel{background:#fff;border:1px solid #e8e8e4;border-radius:14px;padding:15px;margin-bottom:12px}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.list{display:grid;gap:7px}.item{border:1px solid #eee;border-radius:10px;padding:10px;display:flex;justify-content:space-between;gap:10px}.bar{height:9px;background:#eee;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#222}.alert{border-right:4px solid #a33}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}.top{align-items:flex-start}}</style></head><body><div class="wrap"><header class="top"><div class="brand">BuildWise AI+H<small>Construction Project Control • کنترل پروژه ساختمانی</small></div><div class="tools"><select id="project"></select><button onclick="location.href='./index.html'">CRM</button><button onclick="location.href='./visual-project.html'">Showroom</button></div></header><div id="summary" class="grid"></div><div class="tabs"><button class="tab active" data-tab="overview">داشبورد</button><button class="tab" data-tab="schedule">زمان‌بندی</button><button class="tab" data-tab="cost">هزینه و BOQ</button><button class="tab" data-tab="procurement">خرید و تأمین</button><button class="tab" data-tab="quality">کیفیت و ایمنی</button><button class="tab" data-tab="risk">ریسک</button><button class="tab" data-tab="daily">گزارش روزانه</button><button class="tab" data-tab="documents">مدارک</button></div><main id="content"></main></div><script>const SUPABASE_URL='https://beuestoewletjsgmigmf.supabase.co';const SUPABASE_ANON_KEY='sb_publishable_dE92Qm9EtMv4sdNRXF7SRg_7ox1xYax';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let pid=null,dash=null;const $=s=>document.querySelector(s);const money=n=>Number(n||0).toLocaleString('fa-IR');async function init(){const {data,error}=await db.from('construction_projects').select('id,title,project_code,status,physical_progress,planned_progress,current_budget,baseline_budget,actual_cost,target_start,target_finish').order('id',{ascending:false});if(error){$('#content').innerHTML='<div class="panel">خطا در اتصال به پروژه‌ها: '+error.message+'</div>';return}$('#project').innerHTML=(data||[]).map(p=>`<option value="${p.id}">${p.title||'پروژه '+p.id}</option>`).join('');if(data?.length){pid=Number(data[0].id);await load()}else{$('#content').innerHTML='<div class="panel">هنوز پروژه ساختمانی ثبت نشده است. ابتدا پروژه را در CRM ایجاد کنید.</div>'}}async function load(){const r=await db.rpc('buildwise_project_dashboard',{p_project_id:pid});if(r.error){$('#content').innerHTML='<div class="panel">خطای داشبورد: '+r.error.message+'</div>';return}dash=r.data||{};renderSummary();renderTab(document.querySelector('.tab.active').dataset.tab)}function renderSummary(){const p=dash.project||{},c=dash.cost||{},s=dash.schedule||{},r=dash.risks||{};$('#summary').innerHTML=[['پیشرفت واقعی',(p.physical_progress||0)+'%',''],['برنامه‌ای',(p.planned_progress||0)+'%',''],['هزینه واقعی',money(c.actual),''],['تعهدات مالی',money(c.committed),''],['وظایف عقب‌افتاده',s.late||0,s.late?'danger':'ok'],['ریسک باز',r.open||0,r.open?'danger':'ok'],['RFI باز',dash.rfis?.open||0,'' ],['خرید باز',dash.procurement?.open||0,'']].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="metric ${x[2]}">${x[1]}</div></div>`).join('')}function renderTab(t){const c=$('#content'),s=dash.schedule||{},co=dash.cost||{},pr=dash.procurement||{},q=dash.quality||{},r=dash.risks||{};if(t==='overview')c.innerHTML=`<section class="panel"><h3>وضعیت پروژه</h3><div class="row"><div><div class="muted">پیشرفت</div><div class="bar"><i style="width:${Math.min(100,Number(dash.project?.physical_progress||0))}%"></i></div><p>${dash.project?.physical_progress||0}% واقعی در برابر ${dash.project?.planned_progress||0}% برنامه</p></div><div><div class="muted">بودجه</div><p>بودجه: ${money(co.budget)}<br>هزینه واقعی: ${money(co.actual)}<br>تعهدات: ${money(co.committed)}</p></div><div><div class="muted">هشدارهای کلیدی</div><p class="${s.late||r.high?'danger':'ok'}">${s.late||0} تأخیر زمان‌بندی، ${r.high||0} ریسک پرامتیاز، ${pr.late||0} خرید دیرکرددار</p></div></div></section><section class="panel"><h3>هسته کنترل BuildWise</h3><div class="list"><div class="item">Schedule Control <b>WBS + CPM-ready + Milestones</b></div><div class="item">Cost Control <b>BOQ + Budget + Commitments + Payments</b></div><div class="item">Field Control <b>Daily Logs + Progress + Photos</b></div><div class="item">Quality & Safety <b>Inspections + Observations + Corrective Actions</b></div><div class="item">Risk Control <b>Risk Register + AI Alerts</b></div><div class="item">Document Control <b>Revision + Approval + Current Set</b></div></div></section>`;else if(t==='schedule')c.innerHTML=`<section class="panel"><h3>زمان‌بندی و کنترل مسیر بحرانی</h3><p>ساختار داده برای WBS، فازها، فعالیت‌ها، پیش‌نیازها، Baseline، Milestone و تشخیص تأخیر ایجاد شده است.</p><div class="item">فعالیت‌ها <b>${s.tasks||0}</b></div><div class="item">فعالیت بحرانی باز <b>${s.critical_open||0}</b></div><div class="item">عقب‌افتاده <b class="danger">${s.late||0}</b></div></section>`;else if(t==='cost')c.innerHTML=`<section class="panel"><h3>هزینه، BOQ و تعهدات</h3><div class="row"><div class="card">بودجه<br><b>${money(co.budget)}</b></div><div class="card">تعهدات<br><b>${money(co.committed)}</b></div><div class="card">هزینه واقعی<br><b>${money(co.actual)}</b></div></div><p>BOQ به‌صورت آیتم، مقدار، واحد، مشخصات، نرخ بودجه، مقدار واقعی و هزینه واقعی طراحی شده است.</p></section>`;else if(t==='procurement')c.innerHTML=`<section class="panel"><h3>خرید و تأمین</h3><div class="item">سفارش‌های باز <b>${pr.open||0}</b></div><div class="item">تأخیر در تأمین <b class="danger">${pr.late||0}</b></div><p>تأمین‌کننده، استعلام، مقایسه قیمت، سفارش، تحویل و کنترل مواد در مدل داده پیش‌بینی شده است.</p></section>`;else if(t==='quality')c.innerHTML=`<section class="panel"><h3>کیفیت، ایمنی و رفع نقص</h3><div class="item">بازرسی باز <b>${q.open||0}</b></div><div class="item">مشاهده بحرانی باز <b class="danger">${q.critical||0}</b></div><p>Inspection / Observation / Corrective Action / Safety در مدل داده لحاظ شده است.</p></section>`;else if(t==='risk')c.innerHTML=`<section class="panel"><h3>Risk Register</h3><div class="item">ریسک‌های باز <b>${r.open||0}</b></div><div class="item alert">ریسک‌های پرامتیاز <b>${r.high||0}</b></div><p>امتیاز ریسک = احتمال × اثر؛ موتور AI در مرحله بعدی می‌تواند تأخیر، هزینه، خرید و کیفیت را به ریسک‌ها متصل کند.</p></section>`;else if(t==='daily')c.innerHTML=`<section class="panel"><h3>گزارش روزانه کارگاه</h3><p>${dash.last_daily_log?('آخرین گزارش: '+dash.last_daily_log.log_date):'هنوز گزارش روزانه‌ای ثبت نشده است.'}</p><button class="primary" onclick="alert('فرم ثبت گزارش روزانه در توسعه بعدی همین ماژول فعال می‌شود.')">ثبت گزارش روزانه</button></section>`;else c.innerHTML=`<section class="panel"><h3>کنترل مدارک</h3><p>نقشه‌ها، revisions، قراردادها، صورتجلسات، RFI، submittal و فایل‌های پروژه باید در یک مرجع واحد نگهداری شوند.</p></section>`}$('#project').onchange=async e=>{pid=Number(e.target.value);await load()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderTab(b.dataset.tab)});init();</script></body></html>
