ast"></div><script>const U='https://beuestoewletjsgmigmf.supabase.co',K=atob('c2JfcHVibGlzaGFibGVfZEU5MlFtOUV0TXY0c2ROUlhGN1NSZ183b3gxeFlheA=='),db=window.supabase.createClient(U,K);let pid=null,me=null,dash=null;const $=x=>document.querySelector(x),money=x=>Number(x||0).toLocaleString('fa-IR'),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(x){let z=$('#toast');z.textContent=x;z.style.display='block';setTimeout(()=>z.style.display='none',2500)}async function init(){me=(await db.auth.getUser()).data.user;let q=await db.from('construction_projects').select('id,title').order('id',{ascending:false});if(q.error)return fail(q.error.message);$('#project').innerHTML=(q.data||[]).map(p=>`<option value="${p.id}">${esc(p.title||'پروژه '+p.id)}</option>`).join('');if(q.data?.length){pid=q.data[0].id;await load()}else fail('پروژه‌ای ثبت نشده است؛ ابتدا پروژه را در CRM ایجاد کنید.')}function fail(x){$('#content').innerHTML=`<section class="panel">${esc(x)}</section>`}async function load(){let r=await db.rpc('buildwise_project_dashboard',{p_project_id:pid});if(r.error)return fail(r.error.message);dash=r.data||{};let p=dash.project||{},c=dash.cost||{},s=dash.schedule||{},rsk=dash.risks||{};$('#summary').innerHTML=[['پیشرفت',(p.physical_progress||0)+'%',''],['برنامه',(p.planned_progress||0)+'%',''],['هزینه',money(c.actual),''],['تعهدات',money(c.committed),''],['تأخیر',s.late||0,s.late?'danger':'ok'],['ریسک بالا',rsk.high||0,rsk.high?'danger':'ok'],['RFI',dash.rfis?.open||0,''],['خرید',dash.procurement?.open||0,'']].map(a=>`<div class="card"><div class="muted">${a[0]}</div><div class="metric ${a[2]}">${a[1]}</div></div>`).join('');await render('overview')}async function show(t){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.t===t));await render(t)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.t));function form(kind,title,fields){return `<section class="panel"><h3>${title}</h3><form class="form" data-form="${kind}">${fields.map(f=>`<label class="${f.full?'full':''}">${f.label}${f.ta?`<textarea name="${f.n}" rows="3" ${f.req?'required':''}></textarea>`:`<input name="${f.n}" type="${f.type||'text'}" ${f.req?'required':''}>`}</label>`).join('')}<div class="full"><button class="primary">ثبت</button></div></form></section>`}async function render(t){let c=$('#content'),s=dash.schedule||{},co=dash.cost||{},pr=dash.procurement||{},q=dash.quality||{},r=dash.risks||{};if(t==='overview')c.innerHTML=`<section class="panel"><h3>Human-on-Exception</h3><div class="list"><div class="item">ثبت و Audit <b class="ok">خودکار</b></div><div class="item">تاریخ و زمان‌بندی <b class="ok">AI</b></div><div class="item">تشخیص انحراف <b class="ok">AI</b></div><div class="item">خطا / رفتار غیرعادی <b class="danger">Alert + مسئول</b></div><div class="item">تصمیم حساس مالی/حقوقی <b>تأیید انسانی</b></div></div></section><section class="panel"><h3>وضعیت</h3><p>تأخیر ${s.late||0} | ریسک بالا ${r.high||0} | خرید معوق ${pr.late||0} | RFI باز ${dash.rfis?.open||0}</p></section>`;else if(t==='schedule')c.innerHTML=form('task','ثبت فعالیت',[{n:'title',label:'عنوان',req:true},{n:'planned_start',label:'شروع',type:'date',req:true},{n:'planned_finish',label:'پایان',type:'date',req:true},{n:'duration_days',label:'مدت روز',type:'number'},{n:'progress',label:'پیشرفت %',type:'number'},{n:'priority',label:'اولویت'},{n:'description',label:'شرح',ta:true,full:true}])+`<section class="panel"><h3>Gantt</h3><div class="gantt">${await gantt()}</div></section>`;else if(t==='cost')c.innerHTML=form('boq','ثبت BOQ',[{n:'code',label:'کد'},{n:'item_name',label:'نام آیتم',req:true},{n:'category',label:'دسته'},{n:'specification',label:'مشخصات',ta:true,full:true},{n:'unit',label:'واحد'},{n:'planned_qty',label:'مقدار',type:'number'},{n:'unit_budget',label:'نرخ',type:'number'},{n:'budget_amount',label:'مبلغ بودجه',type:'number'}])+form('payment','ثبت پرداخت',[{n:'payee',label:'دریافت‌کننده',req:true},{n:'amount',label:'مبلغ',type:'number',req:true},{n:'due_date',label:'سررسید',type:'date'},{n:'payment_type',label:'نوع'},{n:'notes',label:'شرح',ta:true,full:true}]);else if(t==='procurement')c.innerHTML=form('procurement','ثبت خرید',[{n:'item_name',label:'قلم',req:true},{n:'specification',label:'مشخصات'},{n:'quantity',label:'مقدار',type:'number'},{n:'unit',label:'واحد'},{n:'required_at',label:'موردنیاز',type:'date'},{n:'supplier_name',label:'تأمین‌کننده'},{n:'unit_price',label:'نرخ',type:'number'},{n:'total_price',label:'کل',type:'number'}]);else if(t==='quality')c.innerHTML=form('quality','کیفیت / ایمنی',[{n:'title',label:'عنوان',req:true},{n:'severity',label:'شدت'},{n:'due_date',label:'موعد',type:'date'},{n:'notes',label:'شرح',ta:true,full:true}]);else if(t==='risk')c.innerHTML=form('risk','ریسک',[{n:'title',label:'عنوان',req:true},{n:'category',label:'دسته'},{n:'probability',label:'احتمال ۱-۵',type:'number'},{n:'impact',label:'اثر ۱-۵',type:'number'},{n:'trigger_condition',label:'شرط وقوع'},{n:'mitigation',label:'اقدام کاهشی',ta:true,full:true}]);else if(t==='daily')c.innerHTML=form('daily','گزارش روزانه',[{n:'log_date',label:'تاریخ',type:'date',req:true},{n:'weather',label:'آب‌وهوا'},{n:'workforce_count',label:'تعداد نیرو',type:'number'},{n:'work_summary',label:'فعالیت',ta:true,req:true,full:true},{n:'blockers',label:'موانع',ta:true,full:true},{n:'safety_notes',label:'ایمنی',ta:true,full:true}]);else if(t==='documents')c.innerHTML=form('document','مدرک / Revision',[{n:'document_type',label:'نوع'},{n:'title',label:'عنوان',req:true},{n:'revision',label:'Revision'},{n:'status',label:'وضعیت'},{n:'file_url',label:'لینک فایل',full:true},{n:'source_date',label:'تاریخ',type:'date'}]);else await alerts()}async function gantt(){let r=await db.from('project_schedule_tasks').select('title,planned_start,planned_finish,progress').eq('project_id',pid).order('planned_start').limit(40);if(r.error)return esc(r.error.message);if(!r.data?.length)return '<span class="muted">فعالیتی ثبت نشده است.</span>';let a=r.data.filter(x=>x.planned_start),min=Math.min(...a.map(x=>new Date(x.planned_start))),max=Math.max(...a.map(x=>new Date(x.planned_finish||x.planned_start))),span=Math.max(max-min,86400000);return a.map(x=>{let l=(new Date(x.planned_start)-min)/span*100,w=Math.max(2,((new Date(x.planned_finish||x.planned_start)-new Date(x.planned_start))/span*100));return `<div class="ganttrow"><div><b>${esc(x.title)}</b><div class="muted">${x.planned_start} → ${x.planned_finish||''} | ${x.progress||0}%</div></div><div class="track"><i class="taskbar" style="left:${l}%;width:${w}%"></i></div></div>`}).join('')}async function alerts(){let r=await db.from('project_ai_alerts').select('id,severity,title,explanation,recommendation,status,source,created_at').eq('project_id',pid).order('created_at',{ascending:false}).limit(50);if(r.error)return fail(r.error.message);$('#content').innerHTML=`<section class="panel"><h3>🔔 AI Alert Center</h3><p class="muted">هشدارهای خودکار و دستی. هر مورد باید اصلاح یا بسته شود.</p><div class="list">${(r.data||[]).map(a=>`<div class="item ${a.severity==='critical'||a.severity==='high'?'alert':a.severity==='medium'?'warn':'info'}"><div><b>${esc(a.title)}</b><div class="muted">${esc(a.explanation||'')} · ${new Date(a.created_at).toLocaleString('fa-IR')}</div><p>${esc(a.recommendation||'')}</p><span class="pill">${esc(a.severity||'')} / ${esc(a.status||'')} / ${esc(a.source||'')}</span></div>${a.status!=='resolved'?`<button onclick="resolveAlert(${a.id})">بستن</button>`:''}</div>`).join('')}</div></section>`}async function resolveAlert(id){let r=await db.from('project_ai_alerts').update({status:'resolved',resolved_at:new Date().toISOString()}).eq('id',id);if(r.error)toast(r.error.message);else alerts()}async function scanAI(silent=false){$('#status').textContent='AI در حال اسکن...';let r=await db.rpc('buildwise_ai_control_scan',{p_project_id:pid});if(r.error){$('#status').textContent=r.error.message;return}$('#status').textContent=`AI Scan انجام شد — ${r.data.alerts_created||0} هشدار — ${new Date().toLocaleString('fa-IR')}`;if(!silent)await show('alerts')}async function audit(entity,id,row){if(me)await db.from('ai_audit_events').insert({project_id:pid,actor_user_id:me.id,entity_type:entity,entity_id:id,action_type:'create',mode:'manual',after_state:row})}async function post(table,row,entity){let r=await db.from(table).insert(row).select('id').single();if(r.error)return toast(r.error.message);await audit(entity,r.data.id,row);await scanAI(true);toast('ثبت شد');await load()}document.addEventListener('submit',async e=>{let f=e.target;if(!f.dataset.form)return;e.preventDefault();let o=Object.fromEntries(new FormData(f).entries());if(f.dataset.form==='task')return post('project_schedule_tasks',{project_id:pid,title:o.title,planned_start:o.planned_start,planned_finish:o.planned_finish,duration_days:o.duration_days||null,progress:o.progress||0,priority:o.priority||'normal',description:o.description||null,status:'planned',is_critical:false},'schedule_task');if(f.dataset.form==='boq')return post('project_boq_items',{project_id:pid,code:o.code||null,item_name:o.item_name,category:o.category||null,specification:o.specification||null,unit:o.unit||null,planned_qty:o.planned_qty||0,unit_budget:o.unit_budget||0,budget_amount:o.budget_amount||0},'boq_item');if(f.dataset.form==='payment')return post('project_payments',{project_id:pid,payee:o.payee,amount:o.amount,due_date:o.due_date||null,payment_type:o.payment_type||'project',notes:o.notes||null,status:'pending'},'payment');if(f.dataset.form==='procurement')return post('project_procurement',{project_id:pid,item_name:o.item_name,specification:o.specification||null,quantity:o.quantity||0,unit:o.unit||null,required_at:o.required_at||null,supplier_name:o.supplier_name||null,unit_price:o.unit_price||0,total_price:o.total_price||0,status:'requested'},'procurement');if(f.dataset.form==='quality')return post('project_quality_checks',{project_id:pid,title:o.title,severity:o.severity||'medium',due_date:o.due_date||null,notes:o.notes||null,status:'open'},'quality');if(f.dataset.form==='risk')return post('project_risks',{project_id:pid,title:o.title,category:o.category||null,probability:o.probability||0,impact:o.impact||0,score:Number(o.probability||0)*Number(o.impact||0),status:'open',trigger_condition:o.trigger_condition||null,mitigation:o.mitigation||null},'risk');if(f.dataset.form==='daily')return post('project_daily_logs',{project_id:pid,log_date:o.log_date,weather:o.weather||null,workforce_count:o.workforce_count||0,work_summary:o.work_summary,blockers:o.blockers||null,safety_notes:o.safety_notes||null},'daily_log');if(f.dataset.form==='document')return post('project_documents',{project_id:pid,document_type:o.document_type||null,title:o.title,revision:o.revision||'R0',status:o.status||'current',file_url:o.file_url||null,source_date:o.source_date||null},'document')});async function newAlert(){let title=prompt('عنوان هشدار');if(!title)return;let d=prompt('شرح / اقدام پیشنهادی')||'';await post('project_ai_alerts',{project_id:pid,alert_type:'manual',severity:'medium',title,explanation:d,evidence:{created_by:'human'},recommendation:d,status:'open',source:'manual'},'manual_alert')}$('#project').onchange=async e=>{pid=Number(e.target.value);await load()};init();</script><script src="./project-result-layer.js"></script></body></html>
