<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hooman AI Media</title><style>body{font-family:Arial,sans-serif;background:#f5f4f0;margin:0;color:#17212b}.wrap{max-width:760px;margin:40px auto;padding:18px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:18px;margin:12px 0}textarea{width:100%;height:120px;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:10px}button{padding:10px 14px;border:0;border-radius:9px;background:#0d6657;color:#fff;margin:6px 3px;cursor:pointer}pre{white-space:pre-wrap;background:#f7f7f5;padding:12px;border-radius:10px;min-height:100px}</style></head><body><div class="wrap"><h1>بانک فایل هومان — AI Media Engine</h1><div class="card"><p>موتور رسانه‌ای متصل به Supabase Edge Function و Providerهای fal.ai / Luma.</p><textarea id="p" placeholder="مثلاً: نمای هوایی سینمایی از یک مجتمع لوکس مدرن در قصرالدشت شیراز..."></textarea><br><button onclick="health()">بررسی اتصال</button><button onclick="fal()">ساخت تصویر با fal.ai</button><button onclick="luma()">ساخت ویدئو با Luma</button><pre id="o">آماده</pre></div></div><script>const url='https://beuestoewletjsgmigmf.supabase.co/functions/v1/media-ai';function token(){try{const x=localStorage.getItem('sb-beuestoewletjsgmigmf-auth-token');if(!x)return null;const j=JSON.parse(x);return j.access_token||j.currentSession?.access_token||null}catch{return null}}async function call(action){o.textContent='در حال اجرا...';const t=token();if(!t){o.textContent='Session پیدا نشد. ابتدا وارد CRM شوید و سپس این صفحه را باز کنید.';return}try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({action,prompt:p.value})});o.textContent=JSON.stringify(await r.json(),null,2)}catch(e){o.textContent='ERROR: '+e.message}}function health(){call('health')}function fal(){call('fal_image')}function luma(){call('luma_video')}</script></body></html>
