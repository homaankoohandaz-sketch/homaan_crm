<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Showroom</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script><style>body{margin:0;background:#101820;color:#eef2f4;font-family:Arial,sans-serif}.bar{position:sticky;top:0;z-index:5;background:#101820ee;border-bottom:1px solid #ffffff18;padding:12px 18px;display:flex;justify-content:space-between;gap:10px;align-items:center}.bar a,.btn{color:#fff;text-decoration:none;border:1px solid #ffffff25;background:#ffffff10;border-radius:9px;padding:8px 11px;cursor:pointer}.wrap{max-width:1200px;margin:auto;padding:18px}.hero{min-height:260px;border-radius:20px;background:linear-gradient(135deg,#17364a,#0d6657);padding:26px;display:flex;align-items:end;box-sizing:border-box}.hero h1{font-size:34px;margin:0 0 8px}.muted{color:#aeb9bf}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#17232b;border:1px solid #ffffff12;border-radius:16px;padding:15px}.stat{font-size:24px;font-weight:700;margin-top:6px}.viewer{height:520px;background:#0a1014;border-radius:16px;overflow:hidden;position:relative}.viewer canvas{display:block}.hint{position:absolute;right:12px;bottom:12px;background:#0008;padding:7px 10px;border-radius:8px;font-size:12px}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.gallery img{width:100%;height:150px;object-fit:cover;border-radius:12px}.select{width:100%;padding:10px;background:#101820;color:#fff;border:1px solid #ffffff22;border-radius:9px}@media(max-width:800px){.g{grid-template-columns:1fr 1fr}.gallery{grid-template-columns:1fr 1fr}.viewer{height:400px}}@media(max-width:500px){.g{grid-template-columns:1fr}.hero h1{font-size:26px}}</style></head><body><div class="bar"><b>PROJECT SHOWROOM</b><div><a href="index.html">CRM</a> <a href="import.html">ورود اطلاعات</a></div></div><div class="wrap"><div class="card"><select id="projects" class="select"><option>در حال دریافت پروژه‌ها...</option></select></div><section id="content"><div class="hero"><div><h1>شوروم پروژه</h1><div class="muted">پروژه را انتخاب کنید تا اطلاعات واقعی پروژه، اقتصاد، رسانه و مدل سه‌بعدی در یک فضای ارائه نمایش داده شود.</div></div></div></section></div><script>const U='https://beuestoewletjsgmigmf.supabase.co',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJldWVzdG9ld2xldGp zc21pZ21mIiwicm9sZSI6ImFub24iIiwiaWF0IjE3ODc5ODE0MDAsImV4cCI6MjEwMzU1NzQwMH0.oYeA3TvkHiNW10ogKMzhT91PIT1gtjN99lobpj-tOPw'.replace(/\s/g,''),db=supabase.createClient(U,K);let scene,camera,renderer,model;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=x=>x==null||x===''?'-':Number(x).toLocaleString('fa-IR');async function boot(){let s=(await db.auth.getSession()).data.session;if(!s){content.innerHTML='<div class="card">برای مشاهده شوروم ابتدا وارد CRM شوید.</div>';return}let p=await db.from('construction_projects').select('*').order('created_at',{ascending:false}).limit(50);if(p.error){content.innerHTML='<div class="card">خطا در دریافت پروژه‌ها: '+esc(p.error.message)+'</div>';return}projects.innerHTML=(p.data||[]).map(x=>`<option value="${x.id}">${esc(x.title||('Project #'+x.id))}</option>`).join('')||'<option value="">پروژه‌ای ثبت نشده</option>';projects.onchange=()=>show(projects.value);if(p.data?.[0])show(p.data[0].id)}async function show(id){if(!id)return;let [pr,media,pub]=await Promise.all([db.from('construction_projects').select('*').eq('id',id).single(),db.from('media_assets').select('*').eq('property_id',id).order('created_at',{ascending:false}).limit(30),db.from('project_room_analyzed_results').select('*').eq('project_id',id).maybeSingle()]);if(pr.error){content.innerHTML='<div class="card">پروژه پیدا نشد.</div>';return}let p=pr.data,m=media.data||[],result=pub.data||null;let image=m.find(x=>x.asset_type==='photo'&&x.public_url)?.public_url||'';let modelUrl=m.find(x=>x.asset_type==='3d'&&x.public_url)?.public_url||'';let video=m.find(x=>x.asset_type==='video'&&x.public_url)?.public_url||'';content.innerHTML=`<div class="card" style="margin-bottom:12px"><h2>Project Result</h2><div class="muted">Room فقط نتیجه تحلیل منتشرشده را نمایش می‌دهد.</div><div class="stat">${result?`نسخه ${result.version} · ${new Date(result.published_at).toLocaleDateString('fa-IR')}`:'نتیجه تحلیل منتشر نشده است.'}</div></div><div class="hero" style="${image?`background:linear-gradient(90deg,#101820aa,#10182055),url('${esc(image)}') center/cover`:''}"><div><h1>${esc(p.title||'پروژه')}</h1><div class="muted">نمای ارائه پروژه — اطلاعات از CRM</div></div></div><div class="g" style="margin-top:12px"><div class="card">زمین<div class="stat">${money(p.land_area)} m²</div></div><div class="card">زیربنای ناخالص<div class="stat">${money(p.gross_built_area)} m²</div></div><div class="card">متراژ قابل فروش<div class="stat">${money(p.net_sellable_area)} m²</div></div><div class="card">هزینه برآوردی<div class="stat">${money(p.estimated_cost)}</div></div><div class="card">فروش مورد انتظار<div class="stat">${money(p.expected_sale_price)}</div></div><div class="card">مدت اجرا<div class="stat">${money(p.expected_duration_months)} ماه</div></div></div><div class="card"><h2>مدل سه‌بعدی پروژه</h2><div class="viewer" id="viewer"><div class="hint">چرخش: لمس/ماوس · زوم: اسکرول/دو انگشت</div></div>${modelUrl?`<p class="muted">مدل متصل از رجیستری رسانه پروژه.</p>`:'<p class="muted">هنوز فایل GLB/GLTF برای این پروژه ثبت نشده است. بعداً از همین رجیستری اضافه می‌شود.</p>'}</div><div class="card"><h2>ویدئو / ارائه</h2>${video?`<video controls playsinline style="width:100%;border-radius:12px;max-height:560px" src="${esc(video)}"></video>`:'<div class="muted">ویدئوی پروژه هنوز ثبت نشده است.</div>'}</div><div class="card"><h2>گالری پروژه</h2><div class="gallery">${m.filter(x=>x.public_url&&(x.asset_type==='photo'||x.asset_type==='plan')).map(x=>`<img src="${esc(x.public_url)}" alt="${esc(x.title||'project')}">`).join('')||'<div class="muted">رسانه‌ای ثبت نشده است.</div>'}</div></div>`;if(modelUrl)init3D(modelUrl)}function init3D(url){const el=document.getElementById('viewer');scene=new THREE.Scene();scene.background=new THREE.Color(0x0a1014);camera=new THREE.PerspectiveCamera(45,el.clientWidth/el.clientHeight,.1,1000);camera.position.set(5,4,7);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(el.clientWidth,el.clientHeight);el.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x334455,2));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(5,10,5);scene.add(dl);new THREE.GLTFLoader().load(url,g=>{model=g.scene;scene.add(model);let b=new THREE.Box3().setFromObject(model),c=b.getCenter(new THREE.Vector3()),s=b.getSize(new THREE.Vector3()),mx=Math.max(s.x,s.y,s.z);model.position.sub(c);camera.position.set(mx*1.5,mx*1.0,mx*1.5);camera.lookAt(0,0,0)},undefined,()=>{el.insertAdjacentHTML('beforeend','<div class="hint">بارگذاری مدل ناموفق بود؛ آدرس GLB را بررسی کنید.</div>')});let drag=false,lastX=0,lastY=0;el.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY});window.addEventListener('pointerup',()=>drag=false);window.addEventListener('pointermove',e=>{if(!drag||!model)return;model.rotation.y+=(e.clientX-lastX)*.01;model.rotation.x+=(e.clientY-lastY)*.005;lastX=e.clientX;lastY=e.clientY});el.addEventListener('wheel',e=>{camera.position.multiplyScalar(e.deltaY>0?1.08:.93);camera.lookAt(0,0,0)},{passive:true});(function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)})()}boot();</script><div style="position:fixed;bottom:16px;left:16px;z-index:20"><a href="./project-control.html" style="display:inline-block;color:#fff;background:#0d6657;border-radius:10px;padding:10px 14px;text-decoration:none">Project Result / Architecture</a></div></body></html>
