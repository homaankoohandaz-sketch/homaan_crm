name: BuildWise Agent Lab

on:
  push:
    paths:
      - "agent-lab/**"
  pull_request:
    paths:
      - "agent-lab/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node src/smoke.js
