<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BuildWise Content Bot</title><style>body{font-family:Arial,Vazirmatn,sans-serif;background:#f4f6f5;margin:0;color:#14252d}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:white;border:1px solid #dce4e1;border-radius:18px;padding:18px;margin:12px 0}textarea,input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd8d4;border-radius:10px;margin:6px 0}.btn{padding:11px 16px;border:0;border-radius:10px;background:#0d6657;color:#fff;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><p><a href="./landing.html">BuildWise AI</a></p><h1>ربات تولید محتوای BuildWise</h1><div class="card"><label>پرامپت</label><textarea id="prompt" rows="6" placeholder="مثلاً: یک ویدیوی 20 ثانیه‌ای معرفی BuildWise برای سازندگان ایرانی..."></textarea><div class="grid"><div><label>پلتفرم</label><select id="platform"><option>Instagram Reel</option><option>YouTube Short</option><option>Story</option></select></div><div><label>مدت</label><input id="duration" value="20"></div></div><button class="btn" onclick="generate()">ساخت سناریو و آماده‌سازی</button></div><div class="card"><h3>خروجی</h3><pre id="out">آماده</pre></div></div><script>function generate(){const p=prompt.value.trim();if(!p)return out.textContent='پرامپت را وارد کنید.';out.textContent=JSON.stringify({platform:platform.value,duration:Number(duration.value),prompt:p,pipeline:['script','shot_list','image_video','voice','captions','review','export']},null,2)}</script></body></html>
