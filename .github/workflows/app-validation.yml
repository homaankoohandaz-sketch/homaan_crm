name: Application Validation

on:
  # Run on every PR target so retired-base PRs fail loudly instead of silently bypassing CI.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical branch
        run: |
          test "${GITHUB_BASE_REF:-main}" = "main"
          test "${GITHUB_HEAD_REF:-main}" != "buildwise-implementation"
      - name: Syntax check JavaScript
        shell: bash
        run: |
          set -e
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | while IFS= read -r -d '' f; do
            node --check "$f"
          done
      - name: Release smoke test
        run: node tests/release-smoke.mjs
      - name: Architecture contract test
        run: node tests/architecture-contract.test.js
      - name: Phase code map test
        run: node tests/phase-code-map.test.js
      - name: Infrastructure deployment contract test
        run: node --test tests/infrastructure-deployment.test.mjs
