name: BuildWise Unit Tests
on:
  push:
    branches: ["buildwise-implementation", "buildwise-claude-ready"]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  worker:
    needs: unit
    if: ${{ needs.unit.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: buildwise-implementation
          fetch-depth: 0
      - name: Gate worker credentials
        run: |
          set -euo pipefail
          test -n "${XAI_API_KEY:-}" || { echo "MISSING XAI_API_KEY"; exit 20; }
          test -n "${ANTHROPIC_API_KEY:-}" || { echo "MISSING ANTHROPIC_API_KEY"; exit 21; }
      - name: Install Grok Build
        run: |
          curl -fsSL https://x.ai/cli/install.sh | bash
          echo "$HOME/.grok/bin" >> "$GITHUB_PATH"
          grok --version
      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version
      - name: Execute active task
        shell: bash
        run: |
          set -euo pipefail
          TASK_FILE=$(grep '^active_task:' .agent-control/TASK-QUEUE.yaml | awk '{print $2}')
          test -n "$TASK_FILE"
          TASK_PATH=.agent-control/tasks/${TASK_FILE}.md
          test -f "$TASK_PATH"
          cat .agent-control/BRIEF.md .agent-control/AGENT-SKILL-LOW-TOKEN.md .agent-control/AGENT-TASK-CONTRACT-v1.md .agent-control/TASK-QUEUE.yaml "$TASK_PATH" > /tmp/buildwise-context.txt
          printf '%s\n'             "Execute the active BuildWise task now."             "Read /tmp/buildwise-context.txt first."             "Inspect the repository and current HEAD."             "Implement, test, fix and retest."             "Do not ask the user."             "Stay within allowed scope."             "Do not perform production, secrets, destructive DB, billing or irreversible Git actions."             "Do not start another task." > /tmp/prompt.txt
          grok -p "$(cat /tmp/prompt.txt)" --output-format streaming-json | tee /tmp/grok.log
          claude -p "Review the active BuildWise task and current git diff. Fix concrete defects, run focused tests, and if acceptance is genuinely satisfied mark the task VERIFIED, advance TASK-QUEUE.yaml to the next dependency-ready task, and record evidence in PERFORMANCE.md. Do not ask the user or start another task. Do not perform production, secret/auth, destructive DB, billing or irreversible Git actions." --max-turns 3 --output-format json | tee /tmp/claude.json
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo "NO_WORKER_CHANGES"
            exit 30
          fi
          git config user.name "BuildWise Autonomous Worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "automation: execute active BuildWise task"
          git push origin HEAD:buildwise-implementation
