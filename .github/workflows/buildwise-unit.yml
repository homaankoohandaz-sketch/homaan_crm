name: BuildWise Unit Tests
on:
  push:
    branches: ["buildwise-implementation", "buildwise-claude-ready"]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
