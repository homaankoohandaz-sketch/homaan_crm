name: BuildWise Scheduled Database Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: read

concurrency:
  group: buildwise-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
    steps:
      - name: Verify backup credentials and encryption configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_DB_URL:-}" ]]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_DB_URL. Configure the PostgreSQL connection URI in repository Actions secrets. The value is not printed."
            exit 1
          fi
          if [[ "$SUPABASE_DB_URL" != postgres://* && "$SUPABASE_DB_URL" != postgresql://* ]]; then
            echo "::error::SUPABASE_DB_URL must be a PostgreSQL connection URI. The value is not printed."
            exit 1
          fi
          if [[ -z "${BACKUP_ENCRYPTION_PASSPHRASE:-}" ]]; then
            echo "::error::Missing GitHub Actions secret BACKUP_ENCRYPTION_PASSPHRASE. Add a strong, unique passphrase under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [[ ${#BACKUP_ENCRYPTION_PASSPHRASE} -lt 24 ]]; then
            echo "::error::BACKUP_ENCRYPTION_PASSPHRASE must be at least 24 characters. The value is not printed."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install GnuPG encryption tool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gnupg

      - name: Create logical backup of roles, schema, and data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --data-only --use-copy
          test -s backup/roles.sql
          test -s backup/schema.sql
          test -s backup/data.sql
          grep -q "PostgreSQL database dump complete" backup/schema.sql
          grep -q "PostgreSQL database dump complete" backup/data.sql

      - name: Encrypt every database dump before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          passphrase_file="$RUNNER_TEMP/backup-encryption-passphrase"
          trap 'rm -f "$passphrase_file"' EXIT
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" > "$passphrase_file"
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$passphrase_file" --symmetric --cipher-algo AES256 --output backup/roles.sql.gpg backup/roles.sql
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$passphrase_file" --symmetric --cipher-algo AES256 --output backup/schema.sql.gpg backup/schema.sql
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$passphrase_file" --symmetric --cipher-algo AES256 --output backup/data.sql.gpg backup/data.sql
          test -s backup/roles.sql.gpg
          test -s backup/schema.sql.gpg
          test -s backup/data.sql.gpg
          rm -f backup/roles.sql backup/schema.sql backup/data.sql

      - name: Write backup manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "project_ref=beuestoewletjsgmigmf"
            echo "created_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "github_run_id=$GITHUB_RUN_ID"
            echo "github_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "git_sha=$GITHUB_SHA"
            echo "backup_format=Supabase CLI logical SQL dumps encrypted with GnuPG symmetric AES256"
            echo "contents=roles.sql.gpg,schema.sql.gpg,data.sql.gpg"
            echo "encryption=GnuPG symmetric AES256; decrypt with the separately stored BACKUP_ENCRYPTION_PASSPHRASE secret"
            echo "restore_test=NOT_PERFORMED"
          } > backup/manifest.txt
          (cd backup && sha256sum roles.sql.gpg schema.sql.gpg data.sql.gpg manifest.txt > SHA256SUMS)
          (cd backup && sha256sum --check SHA256SUMS)

      - name: Create Drive upload bundle containing encrypted files only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path("backup")
          required = ["roles.sql.gpg", "schema.sql.gpg", "data.sql.gpg", "manifest.txt", "SHA256SUMS"]
          for name in required:
              p = root / name
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f"Required backup component missing or empty: {name}")
          with ZipFile(root / "homaan-crm-db-backup.zip", "w", compression=ZIP_DEFLATED) as archive:
              for name in required:
                  archive.write(root / name, arcname=name)
          PY
          test -s backup/homaan-crm-db-backup.zip

      - name: Check optional Google Drive configuration
        shell: bash
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          configured=0
          for name in GOOGLE_DRIVE_CLIENT_ID GOOGLE_DRIVE_CLIENT_SECRET GOOGLE_DRIVE_REFRESH_TOKEN; do
            if [[ -n "${!name:-}" ]]; then configured=$((configured + 1)); fi
          done
          if [[ "$configured" -eq 0 ]]; then
            echo "::warning::Google Drive destination is not configured yet. Encrypted GitHub artifact will still be saved; configure all three Google Drive Actions secrets to enable the second destination."
          elif [[ "$configured" -ne 3 ]]; then
            echo "::error::Google Drive setup is incomplete. Configure GOOGLE_DRIVE_CLIENT_ID, GOOGLE_DRIVE_CLIENT_SECRET, and GOOGLE_DRIVE_REFRESH_TOKEN together. Secret values are never printed."
            exit 1
          fi

      - name: Upload encrypted backup bundle to personal Google Drive
        if: ${{ env.GOOGLE_DRIVE_CLIENT_ID != '' && env.GOOGLE_DRIVE_CLIENT_SECRET != '' && env.GOOGLE_DRIVE_REFRESH_TOKEN != '' }}
        shell: bash
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet google-api-python-client google-auth
          python - <<'PY'
          import os
          import sys
          from datetime import datetime, timezone
          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          required = ("GOOGLE_DRIVE_CLIENT_ID", "GOOGLE_DRIVE_CLIENT_SECRET", "GOOGLE_DRIVE_REFRESH_TOKEN")
          if any(not os.environ.get(key) for key in required):
              print("Google Drive credentials are incomplete; values are not printed.", file=sys.stderr)
              raise SystemExit(1)

          try:
              credentials = Credentials(
                  token=None,
                  refresh_token=os.environ["GOOGLE_DRIVE_REFRESH_TOKEN"],
                  token_uri="https://oauth2.googleapis.com/token",
                  client_id=os.environ["GOOGLE_DRIVE_CLIENT_ID"],
                  client_secret=os.environ["GOOGLE_DRIVE_CLIENT_SECRET"],
                  scopes=["https://www.googleapis.com/auth/drive.file"],
              )
              credentials.refresh(Request())
              drive = build("drive", "v3", credentials=credentials, cache_discovery=False)
              stamp = datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ")
              metadata = {
                  "name": f"homaan-crm-db-backup-{stamp}-run-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}.zip",
                  "mimeType": "application/zip",
              }
              folder_id = os.environ.get("GOOGLE_DRIVE_FOLDER_ID", "").strip()
              if folder_id:
                  metadata["parents"] = [folder_id]
              media = MediaFileUpload(
                  "backup/homaan-crm-db-backup.zip",
                  mimetype="application/zip",
                  chunksize=8 * 1024 * 1024,
                  resumable=True,
              )
              request = drive.files().create(
                  body=metadata,
                  media_body=media,
                  fields="id,name,size,createdTime",
              )
              response = None
              while response is None:
                  status, response = request.next_chunk()
                  if status:
                      print(f"Google Drive upload progress: {int(status.progress() * 100)}%")
              print(f"Encrypted backup uploaded to Google Drive. File ID: {response.get('id')}; size: {response.get('size')} bytes.")
          except Exception:
              print("Google Drive upload failed. Check OAuth setup, Drive API access, folder permissions, and the Actions job summary; sensitive credentials were not printed.", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Upload encrypted backup artifact
        if: ${{ always() && hashFiles('backup/manifest.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: buildwise-db-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: backup/
          if-no-files-found: error
          retention-days: 30
