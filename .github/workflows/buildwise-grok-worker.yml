name: BuildWise Grok Worker

on:
  workflow_dispatch:
    inputs:
      task_file:
        description: "Control-plane task file"
        required: true
        default: ".agent-control/tasks/TASK4-PHASE04-LAND-ROI.md"
      branch:
        description: "Implementation branch"
        required: true
        default: "buildwise-implementation"

permissions:
  contents: write

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Install Grok Build
        run: npm install -g @xai-official/grok

      - name: Run bounded Grok worker
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          TASK_FILE: ${{ inputs.task_file }}
        run: |
          set -euo pipefail
          test -n "${XAI_API_KEY:-}" || { echo "XAI_API_KEY GitHub secret is missing"; exit 2; }
          test -f "$TASK_FILE" || { echo "Task file not found: $TASK_FILE"; exit 2; }
          PROMPT="$(cat "$TASK_FILE")

          Follow the task contract exactly.
          First inspect the repository and the task file. Work only from the task's allowed scope.
          Do not modify production secrets, auth configuration, migrations, or unrelated modules.
          Do not create accounts or bypass RLS.
          Run the required focused tests.
          Before finishing, report STATUS, MODEL_USED, BASE_SHA, HEAD, CHANGED, TESTS, EVIDENCE, RISKS, NEXT.
          Do not start another task.
          "
          grok --no-auto-update -p "$PROMPT" -m grok-4.7 --max-turns 3 --always-approve --output-format json | tee grok-result.json

      - name: Enforce task scope
        run: |
          set -euo pipefail
          git fetch origin "${{ inputs.branch }}"
          changed="$(git diff --name-only "origin/${{ inputs.branch }}...HEAD" || true)"
          if [ -z "$changed" ]; then
            echo "No changes produced by worker."
            exit 0
          fi
          echo "$changed"
          while IFS= read -r file; do
            case "$file" in
              project-control.html|tests/*|.agent-control/tasks/TASK4-PHASE04-LAND-ROI.md|.agent-control/BRIEF.md|.agent-control/PERFORMANCE.md|.agent-control/STATE.md)
                ;;
              *)
                echo "SCOPE_ESCALATION: $file"
                exit 3
                ;;
            esac
          done <<< "$changed"

      - name: Commit worker changes
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No repository changes to commit."
            exit 0
          fi
          git config user.name "BuildWise Grok Worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "worker(grok): execute control-plane task"
          git push origin "HEAD:${{ inputs.branch }}"
