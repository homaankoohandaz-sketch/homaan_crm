name: BuildWise Autonomous Worker Loop

on:
  workflow_dispatch:
  push:
    branches: [buildwise-implementation]
    paths:
      - '.agent-control/tasks/TASK-000-ARCHITECTURE-BASELINE.md'
      - '.agent-control/TASK-QUEUE.yaml'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: buildwise-implementation
          fetch-depth: 0

      - name: Install Grok Build
        if: ${{ secrets.XAI_API_KEY != '' }}
        run: |
          curl -fsSL https://x.ai/cli/install.sh | bash
          echo "$HOME/.grok/bin" >> "$GITHUB_PATH"
          grok --version

      - name: Grok implementation
        if: ${{ secrets.XAI_API_KEY != '' }}
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          TASK_FILE=$(grep '^active_task:' .agent-control/TASK-QUEUE.yaml | awk '{print $2}')
          TASK_PATH=.agent-control/tasks/${TASK_FILE}.md
          test -f "$TASK_PATH"
          cat .agent-control/BRIEF.md .agent-control/AGENT-SKILL-LOW-TOKEN.md .agent-control/AGENT-TASK-CONTRACT-v1.md .agent-control/TASK-QUEUE.yaml "$TASK_PATH" > /tmp/buildwise-context.txt
          cat > /tmp/buildwise-prompt.txt <<'PROMPT'
You are the primary BuildWise implementation worker.
Act now. Implement; do not merely explain.
Read /tmp/buildwise-context.txt, inspect git branch/HEAD, then execute the active task.
Stay inside the task scope. Prefer existing code and mature open-source patterns.
Do not ask the user. Do not wait for confirmation.
Run focused tests, fix failures, retest.
Do not perform production, secret/auth, destructive DB, billing, or irreversible Git actions.
Do not start another task.
Leave the working tree ready for independent review.
PROMPT
          grok -p "$(cat /tmp/buildwise-prompt.txt)" --output-format streaming-json | tee /tmp/grok.log
          git diff --check

      - name: Claude independent review and fix
        if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read BRIEF, LOW-TOKEN skill, TASK CONTRACT, TASK QUEUE, active task and git diff.
            Review the implementation against the active task. Fix concrete defects yourself.
            Run focused tests and retest failures.
            Do not ask the user or start another task.
            Do not perform production, secret/auth, destructive DB, billing, or irreversible Git actions.
            If acceptance is genuinely satisfied, mark the task VERIFIED, advance active_task to the next dependency-ready task, and record evidence in PERFORMANCE.md.
            If not satisfied, keep the same active_task and record PARTIAL/BLOCKED with exact reason and NEXT action.

      - name: Final verification and checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if [ -f package.json ]; then npm test --if-present; fi
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name 'BuildWise Autonomous Worker'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'automation: checkpoint autonomous BuildWise cycle'
          git push origin HEAD:buildwise-implementation