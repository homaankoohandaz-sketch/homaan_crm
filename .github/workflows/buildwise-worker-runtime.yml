name: BuildWise Autonomous Worker Runtime

on:
  push:
    branches: [buildwise-implementation]
    paths:
      - '.agent-control/tasks/**'
      - '.agent-control/TASK-QUEUE.yaml'
      - 'tools/worker-runtime.mjs'
      - 'tests/worker-runtime.test.js'
      - '.github/workflows/buildwise-worker-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buildwise-worker-runtime
  cancel-in-progress: false

jobs:
  worker-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MAX_CYCLES: '3'
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: buildwise-implementation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify bounded worker runtime
        run: node tests/worker-runtime.test.js
      - name: Verify no credential is committed
        run: |
          if grep -RInE '(sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9_]{20,}|xoxb-[A-Za-z0-9-]{20,})' .agent-control tools tests .github 2>/dev/null; then
            echo 'Potential credential material detected'
            exit 1
          fi
      - name: Install worker CLIs
        run: |
          set -euo pipefail
          test -n "${XAI_API_KEY:-}" || { echo 'MISSING XAI_API_KEY'; exit 20; }
          test -n "${ANTHROPIC_API_KEY:-}" || { echo 'MISSING ANTHROPIC_API_KEY'; exit 21; }
          curl -fsSL https://x.ai/cli/install.sh | bash
          echo "$HOME/.grok/bin" >> "$GITHUB_PATH"
          npm install -g @anthropic-ai/claude-code
          grok --version
          claude --version
      - name: Execute sequential worker loop
        shell: bash
        run: |
          set -euo pipefail
          for cycle in $(seq 1 "$MAX_CYCLES"); do
            git pull --ff-only origin buildwise-implementation
            TASK_FILE=$(grep '^active_task:' .agent-control/TASK-QUEUE.yaml | awk '{print $2}')
            test -n "$TASK_FILE" || { echo 'QUEUE_EMPTY'; exit 0; }
            TASK_PATH=.agent-control/tasks/${TASK_FILE}.md
            test -f "$TASK_PATH" || { echo "MISSING_TASK $TASK_PATH"; exit 22; }
            BASE_SHA=$(git rev-parse HEAD)
            cat .agent-control/BRIEF.md .agent-control/AGENT-SKILL-LOW-TOKEN.md .agent-control/AGENT-TASK-CONTRACT-v1.md .agent-control/TASK-QUEUE.yaml "$TASK_PATH" > /tmp/buildwise-context.txt
            cat > /tmp/grok-prompt.txt <<'PROMPT'
You are BuildWise's primary execution worker.
Read /tmp/buildwise-context.txt first.
Inspect the actual repository and current HEAD.
Execute the active task now; do not return a plan instead of edits.
Stay inside allowed files and scope.
Prefer existing code and mature open-source patterns.
Do not ask the user or wait for approval.
Run focused tests, fix failures, retest.
Do not perform production, secret/auth, destructive DB, billing, or irreversible Git actions.
Do not start another task.
Leave implementation changes in the working tree for independent review.
PROMPT
            grok -p "$(cat /tmp/grok-prompt.txt)" --output-format streaming-json | tee /tmp/grok-$cycle.log
            git diff --check
            cat > /tmp/claude-prompt.txt <<'PROMPT'
You are BuildWise's independent reviewer/integrator.
Read canonical control-plane files, active task and current git diff.
Review against the active task and acceptance criteria.
Fix concrete defects yourself; do not merely describe them.
Run focused tests and retest.
Do not ask the user or start another task.
Do not perform production, secret/auth, destructive DB, billing, or irreversible Git actions.
If acceptance is genuinely satisfied, mark the task VERIFIED, advance active_task to the next dependency-ready task, and append one compact evidence event to PERFORMANCE.md.
If not satisfied, keep the same active_task and record PARTIAL/BLOCKED with exact evidence and NEXT.
Never mark DONE without implementation + tests + relevant runtime/evidence verification.
PROMPT
            claude -p "$(cat /tmp/claude-prompt.txt)" --max-turns 3 --output-format json | tee /tmp/claude-$cycle.json
            git diff --check
            if [ -z "$(git status --porcelain)" ]; then echo 'NO_CHANGES_FROM_WORKERS'; exit 30; fi
            git add -A
            git commit -m "automation: checkpoint BuildWise cycle $cycle"
            git push origin HEAD:buildwise-implementation
          done