name: BuildWise Autonomous Worker Runtime
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: buildwise-implementation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Runtime test
        run: node tests/worker-runtime.test.js
      - name: Check worker credentials
        id: credentials
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${XAI_API_KEY:-}" ] || [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Worker credentials are not configured; runtime remains safely blocked."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Worker credentials are present; execution loop may proceed."
          fi
      - name: Worker execution gate
        if: steps.credentials.outputs.available == 'true'
        run: echo "Worker execution gate open."
      - name: Worker execution blocked
        if: steps.credentials.outputs.available != 'true'
        run: echo "Worker execution intentionally skipped because credentials are unavailable."
