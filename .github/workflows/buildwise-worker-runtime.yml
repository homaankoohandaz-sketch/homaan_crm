name: BuildWise Autonomous Worker Runtime
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: buildwise-implementation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Runtime test
        run: node tests/worker-runtime.test.js
      - name: Worker credential gate
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "${XAI_API_KEY:-}" || { echo "MISSING XAI_API_KEY"; exit 20; }
          test -n "${ANTHROPIC_API_KEY:-}" || { echo "MISSING ANTHROPIC_API_KEY"; exit 21; }
          echo "Worker credentials are present; execution loop can proceed."
