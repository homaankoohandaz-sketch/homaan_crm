## Operating rule
The orchestrator selects the first READY task whose dependencies are VERIFIED.
A worker executes it.
A reviewer audits it.
Tests run.
Only evidence can advance the queue.
Failures loop back to the same task with a bounded retry.
No user message is required between cycles.
Human gates remain only for production, secrets/auth changes, destructive DB changes, billing, irreversible Git and material legal/financial actions.

