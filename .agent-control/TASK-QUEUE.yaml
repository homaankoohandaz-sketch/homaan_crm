version: 4
policy: evidence-first
active_task: DATA-001-preservation-and-import-contract
operating_mode: crm-first-final-architecture-review
canonical_branch: main
product_scope: focused-real-estate-crm-first
user_data_policy: preserve-existing-data
release_target: personal-trial

priorities:
  - P0: audit-and-discrepancy-register
  - P1: excel-import
  - P1: google-sheets-import
  - P1: search-and-filters
  - P1: permissions-and-rls
  - P2: crm-follow-up-and-customer-sharing
  - P2: ui-and-motion

execution_rules:
  - no-destructive-production-data-changes-without-explicit-approval
  - no-migration-apply-or-repair-before-sql-provenance-reconciliation
  - no-blind-merge-or-force-push
  - one-writer-per-file
  - every-task-has-allowed-files-acceptance-and-evidence
  - done-requires-implementation-tests-runtime-ui-and-security-evidence-as-applicable
  - current-buildwise-scope-is-focused-crm-and-real-estate-transactions
  - archived-ranges-are-not-active-implementation-targets
  - preserve-archived-code-schemas-migrations-and-data; no-destructive-removal

tasks:
  - id: ARCH-001-final-buildwise-architecture
    status: READY_FOR_REVIEW
    owner: master_architect
    depends_on: []
    acceptance: inspect current main source, active UI/routes, database schema and migration lineage, actual runtime and deploy; define the smallest coherent CRM-first BuildWise product; classify each retained active module as keep/rework/disable; list dependencies and release critical path; Grok and Claude independently review; one final decision is recorded for Product Owner approval. Do not touch frozen ranges.
    evidence: .agent-control/FINAL-ARCHITECTURE-RECOMMENDATION.md
  - id: AUDIT-000-reconcile-baseline
    status: IN_PROGRESS
    owner: architecture
    depends_on: []
    acceptance: repository branch and PR inventory; canonical-doc contradictions; checklist status; deployment SHA; live Supabase migration/security/backup evidence; discrepancy register with source and severity
    evidence: .agent-control/STATE.md
  - id: ARCH-002-grok-independent-review
    status: QUEUED
    owner: grok
    depends_on: [ARCH-001-final-buildwise-architecture]
    acceptance: independent challenge of CRM-first product boundary, module keep/disable decisions, risks and shortest delivery sequence; do not inspect or propose work for frozen ranges
    evidence: review report attached to FINAL-ARCHITECTURE-RECOMMENDATION.md
  - id: ARCH-003-claude-independent-review
    status: QUEUED
    owner: claude
    depends_on: [ARCH-001-final-buildwise-architecture]
    acceptance: independent architecture/data-model/security review of CRM-first proposal; identify conflicts and testable corrections; do not inspect or propose work for frozen ranges
    evidence: review report attached to FINAL-ARCHITECTURE-RECOMMENDATION.md
  - id: ARCH-004-product-owner-final-decision
    status: BLOCKED_ON_REVIEWS
    owner: product_owner
    depends_on: [ARCH-002-grok-independent-review, ARCH-003-claude-independent-review]
    acceptance: reconcile both reviews and record one binding final BuildWise architecture decision before broad feature implementation
    evidence: .agent-control/DECISIONS.md
  - id: DATA-001-preservation-and-import-contract
    status: IN_PROGRESS
    owner: data_import
    depends_on: [AUDIT-000-reconcile-baseline]
    acceptance: import contract preserves raw workbook, every row/column, batch identity and rollback isolation; no production write during tests
    evidence: tests/ and .agent-control/STATE.md
  - id: CRM-001-excel-import
    status: QUEUED
    owner: crm
    depends_on: [DATA-001-preservation-and-import-contract]
    acceptance: representative multi-sheet workbook imports with row/column counts reconciled, preview/validation/error isolation/duplicate review/rollback verified
    evidence: tests/ and browser test report
  - id: CRM-002-google-sheets-import
    status: QUEUED
    owner: crm
    depends_on: [DATA-001-preservation-and-import-contract]
    acceptance: explicit OAuth/permission boundary, read-only-by-default source access, selected-sheet preview, repeatable batch import, revoked-token and API-error handling
    evidence: tests/ and browser test report
  - id: CRM-003-search-and-filters
    status: QUEUED
    owner: crm
    depends_on: [AUDIT-000-reconcile-baseline]
    acceptance: search/filter across agreed CRM entities with Persian/Arabic digit normalization, permission-aware results, pagination and no cross-account leakage
    evidence: tests/ and browser test report
  - id: SEC-001-permissions-and-rls
    status: QUEUED
    owner: qa_security
    depends_on: [AUDIT-000-reconcile-baseline]
    acceptance: role/action/table matrix; anon/authenticated/manager cross-user tests; function grants and SECURITY DEFINER review; no widening of access
    evidence: security audit report and tests
  - id: OPS-001-backup-and-restore
    status: QUEUED
    owner: platform
    depends_on: [AUDIT-000-reconcile-baseline]
    acceptance: encrypted backup artifact, checksum verification, off-site encrypted copy, private-key custody and successful isolated restore; no plaintext artifact
    evidence: backup manifest and restore drill report
  - id: CORE-001-unified-task-engine
    status: QUEUED
    owner: core
    depends_on: [AUDIT-000-reconcile-baseline, SEC-001-permissions-and-rls]
    acceptance: assignment, reminders, priority, starred, yes/no response, completion, defer-to-tomorrow and audit tested only in CRM/file/customer follow-up contexts; no project/construction/procurement workflow engine
    evidence: tests/ and browser test report
  - id: UI-001-personal-trial-ux
    status: QUEUED
    owner: app
    depends_on: [CRM-001-excel-import, CRM-002-google-sheets-import, CRM-003-search-and-filters]
    acceptance: responsive end-to-end workflows, loading/empty/error/success states, accessibility and reduced-motion behavior; no visual-only completion
    evidence: browser screenshots and runtime report

advance_rule:
  only_verified_dependencies: true
  max_worker_iterations: 3
  done_requires: implementation_tests_runtime_evidence


archived_product_scope:
  future_product: project-control-app (not approved as a second repo/app yet)
  checklist_ranges:
    - 066-100 # market intelligence, municipal evidence, valuation scenarios
    - 191-235 # project accounting and financial control
    - 343-367 # workflow engine and automation
    - 453-476 # construction/project control
  policy: preserve-code-data-and-migrations; no-active-build; no-navigation-exposure; reactivate-only-by-explicit-decision

archive_freeze:
  authority: .agent-control/ARCHIVE-FREEZE.md
  decision: D-028
  frozen_ranges: [066-100, 191-235, 343-367, 453-476]
  policy: FROZEN_DO_NOT_TOUCH
  applies_to: [chatgpt, grok, claude, codex, all_workers, human_owner, automated_task_generators]
  excluded_from: [active_queue, prompts, estimates, progress, release_blockers, navigation]
  preserve_existing_code_schema_migrations_and_data: true
  exceptions_require_explicit_product_owner_decision: true

