<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود اطلاعات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>body{margin:0;background:#f5f4f0;color:#17212b;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:10px 0}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.btn{padding:9px 12px;border:1px solid #ccc;border-radius:9px;background:#fff;cursor:pointer}.pri{background:#0d6657;color:#fff;border-color:#0d6657}input,select,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ccc;border-radius:8px}textarea{min-height:150px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border-bottom:1px solid #eee;padding:7px;text-align:right;font-size:12px}@media(max-width:700px){.g{grid-template-columns:1fr}.wrap{padding:10px}}</style></head><body><div class="wrap"><p><a href="index.html">← بازگشت به CRM</a></p><h1>ورود اطلاعات</h1><div class="card"><b>Excel یا Google Sheets</b><p>فایل Excel را انتخاب کنید، یا از Google Sheets محدوده موردنظر را Copy و در کادر زیر Paste کنید. نیازی به اتصال حساب Google نیست.</p><input id="file" type="file" accept=".xlsx,.xls,.csv"><textarea id="paste" placeholder="ردیف اول باید نام ستون‌ها باشد؛ سپس جدول Google Sheets را اینجا Paste کنید"></textarea><button class="btn" onclick="parsePaste()">خواندن جدول</button> <button class="btn" onclick="clearAll()">پاک کردن</button></div><div class="card"><div class="g"><div><label>مقصد</label><select id="dest"><option value="properties">املاک</option><option value="leads">خواهان‌ها</option></select></div><div><label>حالت</label><select id="mode"><option value="append">افزودن</option></select></div><div><label>ردیف‌های آماده</label><input id="count" readonly></div></div><div id="map"></div><button class="btn pri" onclick="importRows()">ثبت در CRM</button><div id="out"></div></div></div><script>const U='https://beuestoewletjsgmigmf.supabase.co',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJldWVzdG9ld2xldGp zc21pZ21mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5ODE0MDAsImV4cCI6MjEwMzU1NzQwMH0.oYeA3TvkHiNW10ogKMzhT91PIT1gtjN99lobpj-tOPw'.replace(/\s/g,''),db=supabase.createClient(U,K);let rows=[],headers=[];const aliases={properties:{property_name:['عنوان','نام ملک','property_name','name'],property_type:['نوع','نوع ملک','property_type','type'],region:['منطقه','region'],neighborhood:['محله','neighborhood','area'],built_area:['متراژ','زیربنا','built_area','area'],bedrooms:['خواب','تعداد خواب','bedrooms'],total_price:['قیمت','قیمت کل','total_price','price'],price_per_meter:['قیمت متری','price_per_meter'],status:['وضعیت','status']},leads:{full_name:['نام','نام و نام خانوادگی','full_name','name'],mobile:['موبایل','شماره','شماره موبایل','mobile','phone'],desired_property_type:['نوع ملک','desired_property_type'],desired_region:['منطقه','desired_region','region'],budget_max:['بودجه','حداکثر بودجه','budget_max'],status:['وضعیت','status']}};function norm(x){return String(x??'').trim().toLowerCase().replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\s+/g,'')}function findHeader(h,list){let n=norm(h);return list.find(a=>norm(a)===n)||null}function val(row,field){let list=aliases[dest.value][field]||[];for(const h of headers){if(findHeader(h,list))return row[h]}return null}function clean(field,v){if(v===''||v==null)return null;if(['region','built_area','bedrooms','total_price','price_per_meter','desired_region','budget_max'].includes(field)){let s=String(v).replace(/[٬,]/g,'').replace(/[^0-9.-]/g,'');return s===''?null:Number(s)}return String(v).trim()}function render(){count.value=rows.length;map.innerHTML='<table><tr>'+headers.slice(0,8).map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'+rows.slice(0,5).map(r=>'<tr>'+headers.slice(0,8).map(h=>'<td>'+esc(r[h])+'</td>').join('')+'</tr>').join('')+'</table>'}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setData(a){rows=a.filter(r=>Object.values(r).some(v=>String(v??'').trim()!==''));headers=rows.length?Object.keys(rows[0]):[];render()}function parsePaste(){let t=paste.value.trim();if(!t)return;let lines=t.split(/\r?\n/).filter(Boolean),sep=lines[0].includes('\t')?'\t':',';headers=lines[0].split(sep).map(x=>x.trim());rows=lines.slice(1).map(line=>{let a=line.split(sep);return Object.fromEntries(headers.map((h,i)=>[h,(a[i]??'').trim()]))});render()}file.onchange=async()=>{let f=file.files[0];if(!f)return;let b=await f.arrayBuffer();let wb=XLSX.read(b,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];setData(XLSX.utils.sheet_to_json(ws,{defval:''}))};dest.onchange=()=>{if(rows.length)render()};async function importRows(){if(!rows.length)return out.textContent='ابتدا جدول را وارد کنید.';let s=(await db.auth.getSession()).data.session;if(!s)return out.textContent='ابتدا وارد CRM شوید.';let u=(await db.auth.getUser()).data.user;let data=rows.map(r=>{let o={};Object.keys(aliases[dest.value]).forEach(f=>o[f]=clean(f,val(r,f)));o.status=o.status||'active';o.created_by=u.id;return o}).filter(o=>Object.values(o).some(v=>v!==null&&v!==''));if(!data.length)return out.textContent='هیچ ردیف قابل ثبت پیدا نشد.';let {error}=await db.from(dest.value).insert(data);out.textContent=error?'خطا: '+error.message:`${data.length} ردیف ثبت شد.`}function clearAll(){rows=[];headers=[];paste.value='';map.innerHTML='';count.value=''}</script></body></html>
